  summary: Commencez à utiliser NetApp Console pour pouvoir commencer à créer, protéger
    et gérer les données dans vos environnements sur site et cloud.  Une fois la configuration
    terminée, vous pouvez contrôler l'accès à vos ressources à l'aide de la gestion
    des identités et des accès (IAM), administrer les agents de la console, les comptes
    des fournisseurs de cloud, etc.
